<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon Gym - Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d100f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 75px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }

    .user-profile-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #5eead4;
      color: #0d100f;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      overflow: hidden;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-greeting {
      font-size: 12px;
      color: #9ca3af;
    }

    .user-name {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .settings-btn {
      font-size: 22px;
      color: #cbd5e1;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Workout Banner */
    .workout-banner {
      margin: 10px 20px 20px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 16px;
      padding: 20px;
      color: #0d100f;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .workout-banner:active {
      transform: scale(0.98);
    }

    .banner-badge {
      display: inline-block;
      background-color: rgba(6, 78, 59, 0.2);
      color: #064e3b;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .workout-banner h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .workout-banner p {
      font-size: 12px;
      font-weight: 600;
      color: #064e3b;
    }

    /* Featured Products Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .view-all {
      font-size: 12px;
      color: #5eead4;
      text-decoration: none;
      font-weight: 600;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 20px;
    }

    .product-card {
      background-color: #171a19;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #262a29;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
    }

    .product-icon-box {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #5eead4;
      background-color: rgba(94, 234, 212, 0.05);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .product-icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .product-desc {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: #5eead4;
    }

    .cart-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      background-color: #262a29;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .status-banner {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      grid-column: span 2;
      padding: 20px 0;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #161918;
      border-top: 1px solid #262a29;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 12px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #9ca3af;
      text-decoration: none;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #5eead4;
    }

    .nav-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="user-profile-area">
      <div class="avatar-circle" id="userAvatar">U</div>
      <div>
        <div class="user-greeting">Hello,</div>
        <div class="user-name" id="userName">Loading...</div>
      </div>
    </div>
    <button class="settings-btn" onclick="initPage()" title="Refresh">🔄</button>
  </div>

  <!-- Workout Banner (Video Streaming API Connected) -->
  <div class="workout-banner" id="workoutBanner" onclick="openWorkoutVideo()">
    <div class="banner-badge" id="bannerDuration">🔥 Trending Session</div>
    <h2 id="bannerTitle">Today's Workout is Ready!</h2>
    <p id="bannerSubtitle">Loading session details...</p>
  </div>

  <!-- Featured Products Section -->
  <div class="section-header">
    <div class="section-title">Featured Products</div>
    <a href="#" class="view-all">View All</a>
  </div>

  <!-- Products Grid -->
  <div class="products-grid" id="productsGrid">
    <div class="status-banner">Loading products from server...</div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">💪</span>
      <span>Training</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">🛍️</span>
      <span>Shop</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">📷</span>
      <span>Scan</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </a>
  </div>

  <script>
    const HOME_API_URL = 'https://gym-backend-rfvv.onrender.com/api/user/home/data';
    const VIDEO_STREAM_API_URL = 'https://gym-backend-rfvv.onrender.com/api/user/video-stream/stream/chest_workout_01';

    let currentVideoData = null;

    // 1. Trending Video API load karne ka function
    async function loadTrendingWorkout() {
      const token = localStorage.getItem('token') || localStorage.getItem('userToken') || '';
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      try {
        const res = await fetch(VIDEO_STREAM_API_URL, { method: 'GET', headers });
        const data = await res.json();
        console.log('Video Stream API Response:', data);

        if (res.ok && data) {
          const videoObj = data.data || data;
          currentVideoData = videoObj;

          if (videoObj.title) {
            document.getElementById('bannerTitle').textContent = videoObj.title;
          }
          if (videoObj.duration) {
            document.getElementById('bannerDuration').textContent = `🔥 Trending • ${videoObj.duration} Mins`;
          }
          document.getElementById('bannerSubtitle').textContent = 'Tap here to watch session or scan at gym entry.';
        }
      } catch (err) {
        console.error('Video Stream API Error:', err);
        document.getElementById('bannerSubtitle').textContent = 'Use the Scan button below for quick gym entry.';
      }
    }

    // 2. Home Data (User + Products) load karne ka function
    async function loadHomeData() {
      const productsGrid = document.getElementById('productsGrid');
      const userNameEl = document.getElementById('userName');
      const userAvatarEl = document.getElementById('userAvatar');

      const token = localStorage.getItem('token') || localStorage.getItem('userToken') || '';

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const response = await fetch(HOME_API_URL, { method: 'GET', headers });
        const result = await response.json();

        if (response.ok && result) {
          const payload = result.data || result;
          const userObj = payload.user || payload;
          const fetchedName = userObj.name || userObj.userName || userObj.fullName || 'Raftar';
          userNameEl.textContent = fetchedName;

          if (userObj.profilePic || userObj.avatar) {
            userAvatarEl.innerHTML = `<img src="${userObj.profilePic || userObj.avatar}" alt="Avatar" />`;
          } else {
            userAvatarEl.textContent = fetchedName.charAt(0).toUpperCase();
          }

          const products = payload.featuredProducts || payload.products || [];

          if (Array.isArray(products) && products.length > 0) {
            productsGrid.innerHTML = '';

            products.forEach(item => {
              const pName = item.name || item.title || 'Gym Product';
              const pDesc = item.description || item.desc || 'Premium Fitness Gear';
              const pPrice = item.price ?? 0;
              const pImage = item.image || item.imageUrl || item.thumbnail;

              const mediaContent = pImage 
                ? `<img src="${pImage}" alt="${pName}" />` 
                : `🏋️`;

              const cardHTML = `
                <div class="product-card">
                  <div>
                    <div class="product-icon-box">${mediaContent}</div>
                    <div class="product-name">${pName}</div>
                    <div class="product-desc">${pDesc}</div>
                  </div>
                  <div class="product-footer">
                    <div class="product-price">₹${Number(pPrice).toLocaleString('en-IN')}</div>
                    <button class="cart-btn" onclick="addToCart('${item._id || item.id || ''}')">🛒+</button>
                  </div>
                </div>
              `;
              productsGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
          } else {
            productsGrid.innerHTML = `<div class="status-banner">Abhi koi product listed nahi hai.</div>`;
          }
        } else {
          if (response.status === 401 || response.status === 403) {
            userNameEl.textContent = 'Guest (Login Required)';
            productsGrid.innerHTML = `<div class="status-banner">Token missing ya expired hai! Pehle login karein.</div>`;
          } else {
            throw new Error(result.message || 'Data fetch failed');
          }
        }
      } catch (error) {
        console.error('Home API Error:', error);
        userNameEl.textContent = 'Raftar';
        productsGrid.innerHTML = `<div class="status-banner">Server se connect nahi ho paya. 🔄 Refresh dabayein.</div>`;
      }
    }

    function openWorkoutVideo() {
      if (currentVideoData && currentVideoData.hlsMasterPlaylistUrl) {
        alert(`Playing: ${currentVideoData.title}\nStream URL: ${currentVideoData.hlsMasterPlaylistUrl}`);
      } else {
        alert('Workout session details loading...');
      }
    }

    function addToCart(productId) {
      if (!productId) return;
      alert('Cart mein add ho raha hai! Product ID: ' + productId);
    }

    function initPage() {
      loadTrendingWorkout();
      loadHomeData();
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>

</body>
</html>
